name: Pages
# From the site repositories made by sites@AgentiCCells.dinis (2026-11-16). In the
# template itself (.factory-template exists) nothing is deployed: it is built,
# checked and versioned only. A seeded site deploys on every push to dev.
on:
  push:
    branches: [dev]
  # By hand, by a person only. No schedule: every run starts from a commit (Dinis, 19 Nov 2026 ~01:20 UTC).
  # Pages load the data live in the browser, so they follow data.promptugal.news without a rebuild.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
env:
  # Major and minor are set here by a person. The patch number is set by this workflow only:
  # the first release is v0.1.0, and each later push to dev adds one.
  VERSION_BASE: '0.1'
# Actions pinned to commits (finding EV-2026-011, 18 Nov 2026): to update, look up the tag's commit with
# git ls-remote https://github.com/<owner>/<action> refs/tags/<tag> and change the SHA and its comment together.
jobs:
  build:
    runs-on: ubuntu-latest
    # deployments: read lets the run read CI's own record of the last deployment that passed (security@'s fourth ruling).
    permissions:
      contents: read
      deployments: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      deploy: ${{ steps.mode.outputs.deploy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No release during a hold
        run: if [ -e board/HOLD.md ]; then echo "board/HOLD.md exists" >&2; exit 1; fi
      - id: version
        name: Work out the next version from the tags
        run: |
          last=$(git tag --list "v${VERSION_BASE}.*" | sed "s/^v${VERSION_BASE}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$last" ]; then next=0; else next=$((last + 1)); fi
          echo "version=v${VERSION_BASE}.${next}" >> "$GITHUB_OUTPUT"
          echo "Version: v${VERSION_BASE}.${next}"
      - id: mode
        name: Deploy unless this is the template itself
        run: if [ -e .factory-template ]; then echo deploy=false >> "$GITHUB_OUTPUT"; else echo deploy=true >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: The trailer and signature checks, from the last verified deployment, before any pushed-tree code runs
        # security@'s fourth ruling (Website 948820a7e): the anchor A is the newest commit a passing run deployed, read from
        # GitHub's own deployment record for github-pages with this run's read token (a push alone cannot write it; a person
        # or token with deployments write access could, until Dinis restricts the github-pages environment to dev). Tags are not
        # used. A must exist and be an ancestor of AFTER, or the run fails. The checked range is A..AFTER (so commits of
        # dropped runs are covered) and the checkers come from A's tree, extracted and run in this step before any pushed-tree
        # code runs, under env -i. There is no fallback: no A, no checker in A, or A not an ancestor of AFTER fails the run.
        id: trusted
        env:
          AFTER: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then echo "a shallow checkout: the checks need the full history" >&2; exit 1; fi
          A=""
          for row in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=50" --jq '.[] | "\(.id):\(.sha)"'); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/${row%%:*}/statuses?per_page=1" --jq '.[0].state // ""') || { echo "cannot read a deployment status" >&2; exit 1; }
            if [ "$state" = "success" ]; then A="${row##*:}"; break; fi
          done
          if ! printf '%s' "$A" | grep -Eq '^[0-9a-f]{40}$'; then echo "no successful github-pages deployment to anchor on" >&2; exit 1; fi
          git cat-file -e "$A^{commit}" 2>/dev/null || { echo "the anchor $A is not in this history" >&2; exit 1; }
          git merge-base --is-ancestor "$A" "$AFTER" || { echo "the anchor $A is not an ancestor of $AFTER (a force push?)" >&2; exit 1; }
          echo "anchor=$A" >> "$GITHUB_OUTPUT"
          d=$(mktemp -d)
          for f in check-commits.mjs check-signatures.mjs; do
            git cat-file -e "$A:scripts/$f" 2>/dev/null || { echo "no copy of scripts/$f in the anchor $A" >&2; exit 1; }
            git show "$A:scripts/$f" > "$d/$f"
          done
          env -i PATH="$PATH" HOME="$HOME" node "$d/check-commits.mjs" "$A" "$AFTER"
          env -i PATH="$PATH" HOME="$HOME" node "$d/check-signatures.mjs" "$AFTER"
          rm -rf "$d"
      - name: The signature check's and the workflow's own tests (the pushed code)
        run: |
          node scripts/test-check-signatures.mjs
          node scripts/test-workflow.mjs
      - name: The leak scan's key rules have tests
        run: node scripts/test-leak-scan.mjs
      - name: Copy the events data from data.promptugal.news (a failed read keeps the copy in git)
        run: node scripts/sync-data.mjs
      - name: Check the synced data (on failure, keep the last copy in git; finding EV-2026-006)
        run: node scripts/check-data.mjs --restore
      - run: node scripts/build.mjs
        env:
          SITE_VERSION: ${{ steps.version.outputs.version }}
      - run: node scripts/validate.mjs
      - name: Leak scan (tracked files and the built site; the anchor's scan, extracted and run in this step, clean environment)
        env:
          A: ${{ steps.trusted.outputs.anchor }}
        run: |
          d=$(mktemp -d)
          git cat-file -e "$A:scripts/leak-scan.mjs" 2>/dev/null || { echo "no copy of the leak scan in the anchor $A" >&2; exit 1; }
          git show "$A:scripts/leak-scan.mjs" > "$d/leak-scan.mjs"
          env -i PATH="$PATH" HOME="$HOME" node "$d/leak-scan.mjs"
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  tag:
    needs: [build, deploy]
    # Tags a push only; a run by hand deploys but does not tag (AppSec review, 18 Nov 2026).
    if: ${{ always() && github.event_name == 'push' && needs.build.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag the released commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
